<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REPW Part 1 - PW Workshop</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LN850ZWDRX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-LN850ZWDRX');

  <link rel="stylesheet" type="text/css" href="../style.css">
  <style>
    :root {
      --reader-bg: #07090d;
      --reader-panel: rgba(12, 15, 22, 0.92);
      --reader-panel-soft: rgba(255, 255, 255, 0.07);
      --reader-border: rgba(255, 255, 255, 0.14);
      --reader-text: #f6f1e8;
      --reader-muted: #aeb5c2;
      --reader-gold: #f2c14e;
      --reader-red: #d94f45;
      --reader-green: #5bbf9b;
      --reader-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
    }

    body {
      color: var(--reader-text);
      overflow-x: hidden;
    }

    .main-menu {
      flex-wrap: wrap;
      gap: 4px;
    }

    .main-menu img {
      width: 58px;
      height: auto;
      flex: 0 0 auto;
    }

    #MainInfoPanel {
      width: min(1180px, 94vw);
      padding: 26px 18px 34px;
      background:
        radial-gradient(circle at top left, rgba(217, 79, 69, 0.20), transparent 30%),
        radial-gradient(circle at bottom right, rgba(91, 191, 155, 0.13), transparent 28%),
        rgba(5, 8, 13, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: var(--reader-shadow);
      box-sizing: border-box;
    }

    .comic-reader {
      width: 100%;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 18px;
      border-radius: 0;
      background: transparent;
      box-sizing: border-box;
    }

    .reader-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 0 4px;
    }

    .reader-brand {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .reader-logo {
      width: clamp(130px, 22vw, 220px);
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.55));
    }

    .reader-title {
      min-width: 0;
    }

    .reader-title h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 56px);
      line-height: 0.95;
      color: var(--reader-gold);
      text-transform: uppercase;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.65);
    }

    .reader-title p {
      margin: 8px 0 0;
      color: var(--reader-muted);
      font-size: 15px;
    }

    .reader-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .reader-button {
      min-width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      border: 1px solid var(--reader-border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--reader-text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .reader-button:hover,
    .reader-button:focus-visible {
      background: rgba(242, 193, 78, 0.16);
      border-color: rgba(242, 193, 78, 0.68);
      outline: none;
      transform: translateY(-1px);
    }

    .reader-button.primary {
      background: var(--reader-gold);
      border-color: var(--reader-gold);
      color: #17120a;
    }

    .reader-stage {
      position: relative;
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr) 68px;
      align-items: center;
      gap: 14px;
    }

    .page-shell {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: #030405;
      border: 1px solid var(--reader-border);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.48);
    }

    .page-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      z-index: 2;
    }

    #previewImage {
      width: 100%;
      max-height: min(72vh, 780px);
      object-fit: contain;
      display: block;
      background: #030405;
      cursor: zoom-in;
    }

    .page-meta {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(5, 7, 11, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(10px);
      z-index: 3;
    }

    #pageCounter {
      color: var(--reader-gold);
      font-weight: 800;
      white-space: nowrap;
    }

    .progress-track {
      height: 6px;
      flex: 1;
      min-width: 96px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
    }

    #pageProgress {
      width: 0;
      height: 100%;
      display: block;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--reader-red), var(--reader-gold), var(--reader-green));
      transition: width 180ms ease;
    }

    .stage-nav {
      width: 68px;
      height: clamp(160px, 34vw, 360px);
      border-radius: 8px;
      border: 1px solid var(--reader-border);
      background: rgba(255, 255, 255, 0.065);
      color: var(--reader-text);
      font-size: 54px;
      line-height: 1;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .stage-nav:hover,
    .stage-nav:focus-visible {
      background: rgba(217, 79, 69, 0.18);
      border-color: rgba(242, 193, 78, 0.62);
      outline: none;
      transform: scale(1.02);
    }

    .reader-strip {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-radius: 8px;
      background: var(--reader-panel);
      border: 1px solid var(--reader-border);
    }

    .strip-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: var(--reader-muted);
      font-size: 14px;
    }

    #thumbs,
    #overlayThumbs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 2px 2px 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(242, 193, 78, 0.65) rgba(255, 255, 255, 0.08);
    }

    #thumbs button,
    #overlayThumbs button {
      flex: 0 0 auto;
      width: 116px;
      padding: 0;
      overflow: hidden;
      border-radius: 8px;
      border: 2px solid transparent;
      background: var(--reader-panel-soft);
      cursor: pointer;
      opacity: 0.62;
      transition: transform 160ms ease, opacity 160ms ease, border-color 160ms ease;
    }

    #thumbs button:hover,
    #thumbs button:focus-visible,
    #overlayThumbs button:hover,
    #overlayThumbs button:focus-visible {
      opacity: 0.92;
      transform: translateY(-2px);
      outline: none;
    }

    #thumbs button.active,
    #overlayThumbs button.active {
      opacity: 1;
      border-color: var(--reader-gold);
      box-shadow: 0 0 0 2px rgba(242, 193, 78, 0.18);
    }

    #thumbs img,
    #overlayThumbs img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
    }

    #comicOverlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      display: none;
      overflow: hidden;
      background: rgba(2, 3, 6, 0.96);
      z-index: 10000;
    }

    #comicOverlay.open {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .overlay-topbar {
      min-width: 0;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 16px;
      background: rgba(8, 10, 15, 0.86);
      border-bottom: 1px solid var(--reader-border);
      backdrop-filter: blur(12px);
      z-index: 2;
    }

    .overlay-title {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--reader-muted);
      font-weight: 700;
    }

    .overlay-title span:first-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #overlayCounter {
      flex: 0 0 auto;
      color: var(--reader-gold);
      white-space: nowrap;
    }

    .overlay-stage {
      min-width: 0;
      box-sizing: border-box;
      min-height: 0;
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr) 76px;
      align-items: center;
      gap: 12px;
      padding: 12px;
    }

    #overlayImage {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 178px);
      object-fit: contain;
      display: block;
      background: #020304;
      border-radius: 8px;
    }

    .overlay-bottom {
      min-width: 0;
      max-width: 100vw;
      box-sizing: border-box;
      padding: 10px 14px 12px;
      background: rgba(8, 10, 15, 0.86);
      border-top: 1px solid var(--reader-border);
      backdrop-filter: blur(12px);
    }

    #overlayThumbs button {
      width: 88px;
    }

    #overlayThumbs {
      max-width: 100%;
      min-width: 0;
    }

    @media (max-width: 820px) {
      #MainInfoPanel {
        width: 100%;
        padding: 18px 10px 26px;
        border-left: 0;
        border-right: 0;
      }

      .reader-header {
        grid-template-columns: 1fr;
      }

      .reader-actions {
        justify-content: flex-start;
      }

      .reader-stage,
      .overlay-stage {
        grid-template-columns: minmax(0, 1fr);
      }

      .stage-nav {
        position: absolute;
        top: 50%;
        width: 48px;
        height: 104px;
        z-index: 4;
        transform: translateY(-50%);
        background: rgba(5, 7, 11, 0.72);
      }

      .stage-nav:hover,
      .stage-nav:focus-visible {
        transform: translateY(-50%) scale(1.02);
      }

      .stage-nav.prev {
        left: 8px;
      }

      .stage-nav.next {
        right: 8px;
      }

      .overlay-stage .stage-nav {
        position: fixed;
      }

      #previewImage {
        max-height: 68vh;
      }

      .page-meta {
        left: 8px;
        right: 8px;
        bottom: 8px;
      }

      #thumbs button {
        width: 94px;
      }
    }

    @media (max-width: 560px) {
      .reader-brand {
        align-items: flex-start;
        flex-direction: column;
      }

      .reader-button {
        height: 42px;
        padding: 0 11px;
      }

      .reader-button .label {
        display: none;
      }

      .page-meta {
        align-items: flex-start;
        flex-direction: column;
      }

      .progress-track {
        width: 100%;
      }

      .overlay-topbar {
        padding: 10px;
      }

      .overlay-title span:first-child {
        display: none;
      }

      #overlayImage {
        max-height: calc(100vh - 164px);
      }
    }
  </style>
</head>

<body>

<link rel="stylesheet" type="text/css" href="../navbar.css">
<header class="main-menu">
  <img src="../assets/imgs/workshop-icon.png">
  <a href="../index.html">Головна</a>
  <a href="../Software.html">Програмне Забезпечення</a>
  <a href="../Guides.html">Гайди</a>

  <a href="../comix.html">Комікси</a>
</header>

<div id="MainInfoPanel">
  <main class="comic-reader" aria-label="REPW Part 1 comic reader">
    <section class="reader-header">
      <div class="reader-brand">
        <img class="reader-logo" src="REPW-Manga-Logo.png" alt="REPW">
        <div class="reader-title">
          <h1>Частина 1</h1>
          <p>11 сторінок</p>
        </div>
      </div>

      <div class="reader-actions">
        <button id="openOverlay" class="reader-button primary" type="button" aria-label="Відкрити на весь екран">
          <span aria-hidden="true">[ ]</span>
          <span class="label">На весь екран</span>
        </button>
      </div>
    </section>

    <section class="reader-stage" aria-label="Поточна сторінка">
      <button id="pagePrev" class="stage-nav prev" type="button" aria-label="Попередня сторінка">&lsaquo;</button>

      <div class="page-shell">
        <img id="previewImage" src="Part1/Frame0.png" alt="REPW Part 1, сторінка 1">
        <div class="page-meta">
          <span id="pageCounter">Сторінка 1 з 11</span>
          <span class="progress-track" aria-hidden="true"><span id="pageProgress"></span></span>
        </div>
      </div>

      <button id="pageNext" class="stage-nav next" type="button" aria-label="Наступна сторінка">&rsaquo;</button>
    </section>

    <section class="reader-strip" aria-label="Список сторінок">
      <div class="strip-head">
        <span>Сторінки</span>
        <span id="stripCounter">1 / 11</span>
      </div>
      <div id="thumbs" role="list"></div>
    </section>
  </main>
</div>

<footer>
  Розроблено  <a href="https://t.me/SilverEcho97">Silver Echo Games</a>
</footer>

<div id="comicOverlay" aria-hidden="true">
  <div class="overlay-topbar" role="dialog" aria-modal="true" aria-label="REPW Part 1 fullscreen reader">
    <div class="overlay-title">
      <span>REPW - Частина 1</span>
      <span id="overlayCounter">Сторінка 1 з 11</span>
    </div>
    <button id="overlayClose" class="reader-button" type="button" aria-label="Закрити">
      <span aria-hidden="true">&times;</span>
      <span class="label">Закрити</span>
    </button>
  </div>

  <div class="overlay-stage">
    <button id="overlayLeft" class="stage-nav prev" type="button" aria-label="Попередня сторінка">&lsaquo;</button>
    <img id="overlayImage" src="Part1/Frame0.png" alt="REPW Part 1, сторінка 1">
    <button id="overlayRight" class="stage-nav next" type="button" aria-label="Наступна сторінка">&rsaquo;</button>
  </div>

  <div class="overlay-bottom">
    <div id="overlayThumbs" role="list"></div>
  </div>
</div>

<script>
  (function(){
    const images = [
      "Part1/Frame0.png",
      "Part1/Frame1.png",
      "Part1/Frame2.png",
      "Part1/Frame3.png",
      "Part1/Frame4.png",
      "Part1/Frame5.png",
      "Part1/Frame6.png",
      "Part1/Frame7.png",
      "Part1/Frame8.png",
      "Part1/Frame9.png",
      "Part1/Frame10.png"
    ];

    let index = 0;
    const previewImage = document.getElementById('previewImage');
    const pageCounter = document.getElementById('pageCounter');
    const stripCounter = document.getElementById('stripCounter');
    const pageProgress = document.getElementById('pageProgress');
    const thumbsContainer = document.getElementById('thumbs');
    const pagePrev = document.getElementById('pagePrev');
    const pageNext = document.getElementById('pageNext');
    const openOverlayButton = document.getElementById('openOverlay');

    const overlay = document.getElementById('comicOverlay');
    const overlayImage = document.getElementById('overlayImage');
    const overlayCounter = document.getElementById('overlayCounter');
    const overlayThumbsContainer = document.getElementById('overlayThumbs');
    const overlayLeft = document.getElementById('overlayLeft');
    const overlayRight = document.getElementById('overlayRight');
    const overlayClose = document.getElementById('overlayClose');

    function buildThumbs(container) {
      container.innerHTML = images.map(function(src, i) {
        return '<button type="button" data-index="' + i + '" aria-label="Сторінка ' + (i + 1) + '">' +
          '<img src="' + src + '" alt="Мініатюра сторінки ' + (i + 1) + '">' +
        '</button>';
      }).join('');
    }

    buildThumbs(thumbsContainer);
    buildThumbs(overlayThumbsContainer);

    const pageThumbs = thumbsContainer.querySelectorAll('button');
    const overlayThumbs = overlayThumbsContainer.querySelectorAll('button');

    function setActiveThumbs() {
      pageThumbs.forEach(function(thumb) {
        thumb.classList.toggle('active', Number(thumb.dataset.index) === index);
      });
      overlayThumbs.forEach(function(thumb) {
        thumb.classList.toggle('active', Number(thumb.dataset.index) === index);
      });
    }

    function centerActiveThumb(container) {
      const active = container.querySelector('.active');
      if (active && active.scrollIntoView) {
        active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }

    function updateUI() {
      const pageNumber = index + 1;
      const counterText = 'Сторінка ' + pageNumber + ' з ' + images.length;
      const imageAlt = 'REPW Part 1, сторінка ' + pageNumber;

      previewImage.src = images[index];
      previewImage.alt = imageAlt;
      overlayImage.src = images[index];
      overlayImage.alt = imageAlt;
      pageCounter.textContent = counterText;
      stripCounter.textContent = pageNumber + ' / ' + images.length;
      overlayCounter.textContent = counterText;
      pageProgress.style.width = ((pageNumber / images.length) * 100) + '%';
      setActiveThumbs();
    }

    function goTo(newIndex) {
      index = (newIndex + images.length) % images.length;
      updateUI();
      centerActiveThumb(thumbsContainer);
      if (overlay.classList.contains('open')) {
        centerActiveThumb(overlayThumbsContainer);
      }
    }

    function nextImage() {
      goTo(index + 1);
    }

    function prevImage() {
      goTo(index - 1);
    }

    function openOverlay() {
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      updateUI();
      centerActiveThumb(overlayThumbsContainer);
      overlayClose.focus();
    }

    function closeOverlay() {
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      openOverlayButton.focus();
    }

    pagePrev.addEventListener('click', prevImage);
    pageNext.addEventListener('click', nextImage);
    previewImage.addEventListener('click', openOverlay);
    openOverlayButton.addEventListener('click', openOverlay);
    overlayLeft.addEventListener('click', prevImage);
    overlayRight.addEventListener('click', nextImage);
    overlayClose.addEventListener('click', closeOverlay);

    pageThumbs.forEach(function(thumb) {
      thumb.addEventListener('click', function() {
        goTo(Number(thumb.dataset.index));
      });
    });

    overlayThumbs.forEach(function(thumb) {
      thumb.addEventListener('click', function() {
        goTo(Number(thumb.dataset.index));
      });
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') {
        prevImage();
      } else if (e.key === 'ArrowRight') {
        nextImage();
      } else if (e.key === 'Escape' && overlay.classList.contains('open')) {
        closeOverlay();
      } else if ((e.key === 'Enter' || e.key === ' ') && document.activeElement === previewImage) {
        openOverlay();
      }
    });

    updateUI();
  })();
</script>

</body>
