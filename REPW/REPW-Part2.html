  <style>
    /* Comic viewer styles - preview + overlay (copied from Part1) */
    #comicViewer { max-width: 900px; margin: 0 auto; text-align: center; }
    #comicViewer .preview { cursor: pointer; width: 100%; border:4px solid #333; box-shadow: 0 4px 10px rgba(0,0,0,0.3); background:#000; display:block; }
    #openHint { margin-top:8px; color:#ddd; }

    #thumbs { margin-top:12px; display:flex; gap:8px; overflow-x:auto; justify-content:center; padding-bottom:6px; }
    #thumbs img { width:96px; height:auto; cursor:pointer; opacity:0.6; border:2px solid transparent; }
    #thumbs img.active { opacity:1; border-color: gold; }

    /* Hide scrollbars but keep scrolling (thumbnails) */
    #thumbs, #overlayThumbs {
      overflow-x: auto;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE 10+ */
    }
    #thumbs::-webkit-scrollbar, #overlayThumbs::-webkit-scrollbar { display: none; height: 0; }

    /* Overlay styles */
    #comicOverlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.92); z-index:10000; }
    #comicOverlay.open { display:flex; }
    .overlay-content { position:relative; width: min(95vw,1200px); max-height:95vh; display:flex; flex-direction:column; align-items:center; }

    /* Default: contain image (for portrait / small screens) */
    #overlayImage { max-width:100%; max-height: calc(100vh - 180px); object-fit:contain; }
    .overlay-close { position:absolute; top:12px; right:12px; background:transparent; color:#fff; font-size:32px; border:none; cursor:pointer; z-index:3; }
    .overlay-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.5); color:#fff; border:none; padding:12px; font-size:18px; cursor:pointer; z-index:3; }
    #overlayLeft { left:12px; }
    #overlayRight { right:12px; }

    #overlayCounter { margin-top:10px; color:gold; font-weight:bold; z-index:3; }
    #overlayThumbs { margin-top:12px; display:flex; gap:8px; overflow-x:auto; justify-content:center; padding-bottom:6px; width:100%; }
    #overlayThumbs img { width:72px; height:auto; cursor:pointer; opacity:0.6; border:2px solid transparent; }
    #overlayThumbs img.active { opacity:1; border-color:gold; }

    /* Wide / landscape screens: fullscreen image and overlay controls on top of it */
    @media (orientation: landscape) and (min-width:1000px) {
      #comicOverlay.open { align-items:stretch; }
      .overlay-content { width:100vw; height:100vh; max-height:none; justify-content:center; }
      /* Make image scale to fit the viewport without cropping */
      #overlayImage { width:100vw; height:100vh; object-fit:contain; background-color:#000; }

      /* Position controls as overlays on the image */
      .overlay-close { top:18px; right:18px; }
      .overlay-nav { background:transparent; padding:18px; }
      #overlayLeft { left:24px; }
      #overlayRight { right:24px; }

      /* Counter and thumbs overlay on bottom of screen */
      #overlayCounter { position:absolute; bottom:18px; left:50%; transform:translateX(-50%); margin-top:0; }
      #overlayThumbs { position:absolute; bottom:56px; left:50%; transform:translateX(-50%); margin-top:0; width:auto; background:rgba(0,0,0,0.25); padding:6px 8px; border-radius:6px; }
      #overlayThumbs img { width:56px; }
    }

    @media (max-width:600px){ .overlay-nav{ padding:8px; font-size:16px;} #overlayThumbs img{ width:52px;} }
  </style>

<!-- Fullscreen overlay viewer -->
<div id="comicOverlay" aria-hidden="true">
  <div class="overlay-content" role="dialog" aria-modal="true">
    <button id="overlayClose" class="overlay-close" aria-label="Закрити">&times;</button>

    <div id="overlayCounter">Зображення 1 з 27</div>
    <div id="overlayThumbs"></div>
  </div>
</div>

<script>
  (function(){
    const images = [
      "Part2/Frame0.png","Part2/Frame1.png","Part2/Frame2.png","Part2/Frame3.png","Part2/Frame4.png","Part2/Frame5.png",
      "Part2/Frame6.png","Part2/Frame7.png","Part2/Frame8.png","Part2/Frame9.png","Part2/Frame10.png","Part2/Frame11.png",
      "Part2/Frame12.png","Part2/Frame13.png","Part2/Frame14.png","Part2/Frame15.png","Part2/Frame16.png","Part2/Frame17.png",
      "Part2/Frame18.png","Part2/Frame20.png","Part2/Frame21.png","Part2/Frame22.png","Part2/Frame23.png","Part2/Frame24.png",
      "Part2/Frame25.png","Part2/Frame26.png","Part2/Frame27.png"
    ];

    let index = 0;
    const previewImage = document.getElementById('previewImage');
    const pageThumbs = document.querySelectorAll('#thumbs img');

    const overlay = document.getElementById('comicOverlay');
    const overlayImage = document.getElementById('overlayImage');
    const overlayCounter = document.getElementById('overlayCounter');
    const overlayThumbsContainer = document.getElementById('overlayThumbs');
    const overlayLeft = document.getElementById('overlayLeft'); // left button - Previous
    const overlayRight = document.getElementById('overlayRight'); // right button - Next
    const overlayClose = document.getElementById('overlayClose');

    // populate overlay thumbnails
    overlayThumbsContainer.innerHTML = images.map((src,i)=>`<img src="${src}" data-index="${i}" alt="${i+1}">`).join('');
    const overlayThumbs = overlayThumbsContainer.querySelectorAll('img');

    function updatePageUI(){
      previewImage.src = images[index];
      if(pageThumbs) pageThumbs.forEach(t=> t.classList.toggle('active', Number(t.dataset.index)===index));
    }
    function updateOverlayUI(){
      overlayImage.src = images[index];
      overlayCounter.textContent = `Зображення ${index+1} з ${images.length}`;
      overlayThumbs.forEach(t=> t.classList.toggle('active', Number(t.dataset.index)===index));
      if(pageThumbs) pageThumbs.forEach(t=> t.classList.toggle('active', Number(t.dataset.index)===index));
      const active = overlayThumbsContainer.querySelector('img.active');
      if(active && active.scrollIntoView) active.scrollIntoView({behavior:'smooth', inline:'center'});
    }

    function nextImage(){ index = (index+1) % images.length; updateOverlayUI(); }
    function prevImage(){ index = (index-1 + images.length) % images.length; updateOverlayUI(); }

    function openOverlay(startIndex=0){
      index = startIndex;
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden','false');
      document.body.style.overflow = 'hidden';
      updateOverlayUI();
    }

    function closeOverlay(){
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden','true');
      document.body.style.overflow = '';
      updatePageUI();
    }

    // Bind events
    previewImage.addEventListener('click', ()=> openOverlay(index));
    pageThumbs.forEach(t=> t.addEventListener('click', ()=> openOverlay(Number(t.dataset.index))));

    overlayLeft.addEventListener('click', prevImage); // left -> Previous
    overlayRight.addEventListener('click', nextImage); // right -> Next
    overlayClose.addEventListener('click', closeOverlay);

    overlayThumbs.forEach(t=> t.addEventListener('click', ()=>{ index = Number(t.dataset.index); updateOverlayUI(); }));

    // click outside content closes overlay
    overlay.addEventListener('click', (e)=> { if(e.target === overlay) closeOverlay(); });

    // keyboard handling
    document.addEventListener('keydown', (e)=>{
      if(overlay.classList.contains('open')){
        if(e.key === 'Escape') closeOverlay();
        else if(e.key === 'ArrowLeft') prevImage();
        else if(e.key === 'ArrowRight') nextImage();
      }
    });

    // initialize preview and page thumbs
    updatePageUI();
  })();
</script>
