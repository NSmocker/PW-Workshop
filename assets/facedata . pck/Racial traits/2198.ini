//ini文件名为模板ID
//partnum中的count对应模板中特征数量，从part0至part5对应模板中最多六个配置。本配置表无上限。
//name是动作模型里的骨骼名
//part中的count是骨骼受捏脸模型影响的条目数量
//index是具体条目，第一个值是条目索引，第二个是操作项索引。条目索引是range中的条目排序，可参考configs下facecustrange文件。操作项索引为0-8，分别对应位移、缩放、旋转的xyz。
//举例：0就是foreHeadTranslateY,1是foreheadTranslateZ,依此类推。配置文件2198的配置方式，就是让middleface_conduction骨骼，受到middlefaceTranslateY和middlefaceScaleZ两个条目的影响。



[partnum]
count = 1

[part0]
name = middleface_conduction
count = 2

index0 = 48,1
index1 = 49,5